name: Build, Test & Publish

on:
  push:
    tags:
      - 'v*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm via corepack
        run: corepack enable pnpm

      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set library version
        run: |
          node -e "const p=require('./projects/signal-form/package.json'); p.version='${{ steps.version.outputs.VERSION }}'; require('fs').writeFileSync('./projects/signal-form/package.json', JSON.stringify(p, null, 2) + '\n')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          NODE_OPTIONS: '--max_old_space_size=6144'

      - name: Run tests
        run: pnpm run test -- --run
        env:
          NODE_OPTIONS: '--max_old_space_size=6144'

      - name: Publish to npm
        run: |
          cd dist/signal-form
          pnpm publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}